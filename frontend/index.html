<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Marvel Clue Hunt is a live team-based puzzle challenge with real-time leaderboard and timer gameplay." />
    <meta name="robots" content="index, follow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Marvel Clue Hunt" />
    <meta property="og:description" content="Join the Marvel Clue Hunt challenge with your team and solve clues in real time." />
    <meta property="og:url" content="https://inkfinity-war.onrender.com/" />
    <meta property="og:image" content="/vite.svg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Marvel Clue Hunt" />
    <meta name="twitter:description" content="Join the Marvel Clue Hunt challenge with your team and solve clues in real time." />
    <meta name="twitter:image" content="/vite.svg" />
    <title>Marvel Clue Hunt</title>

    <script>
      (function () {
        var path = window.location.pathname
        var knownRoutes = ['/admin', '/attendee', '/volunteer']
        if (!window.location.hash && knownRoutes.indexOf(path) !== -1) {
          var target = window.location.origin + '/#' + path + window.location.search
          window.location.replace(target)
        }
      })()
    </script>

    <script type="module">
      if (import.meta.env.DEV) {
        const script = document.createElement('script')
        script.src = 'https://cdn.jsdelivr.net/npm/eruda'
        script.onload = () => window.eruda && window.eruda.init()
        document.head.appendChild(script)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
