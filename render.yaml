services:
  - type: web
    name: marvel-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip setuptools && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10

  - type: web
    name: marvel-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx http-server dist -p $PORT -g
    envVars:
      - key: VITE_API_URL
        value: https://marvel-backend.onrender.com